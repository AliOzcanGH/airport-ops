server.port=8084
spring.application.name=report-service

spring.datasource.url=${REPORT_DB_URL:jdbc:postgresql://localhost:5434/airport_ops_db?currentSchema=report}
spring.datasource.username=${REPORT_DB_USERNAME:airport_user}
spring.datasource.password=${REPORT_DB_PASSWORD:strong-pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=report

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=report
spring.flyway.default-schema=report
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history

management.endpoints.web.exposure.include=health,info

app.iam.jwks-uri=${IAM_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
app.iam.issuer=${IAM_TOKEN_ISSUER:airport-ops-iam}
app.iam.audience=${IAM_TOKEN_AUDIENCE:report-service}

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
app.report.gate-utilization-cache-ttl-seconds=3600

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.group-id=report-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

app.kafka.flight-events-topic=flight-events
app.kafka.station-events-topic=station-events

app.internal-service-secret=${INTERNAL_SERVICE_SECRET:local-dev-internal-secret}
