server.port=8086
spring.application.name=audit-service

spring.datasource.url=${AUDIT_DB_URL:jdbc:postgresql://localhost:5434/airport_ops_db?currentSchema=audit}
spring.datasource.username=${AUDIT_DB_USERNAME:airport_user}
spring.datasource.password=${AUDIT_DB_PASSWORD:strong-pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=audit

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=audit
spring.flyway.default-schema=audit
spring.flyway.create-schemas=false
spring.flyway.table=flyway_schema_history

management.endpoints.web.exposure.include=health,info

app.iam.jwks-uri=${IAM_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}
app.iam.issuer=${IAM_TOKEN_ISSUER:airport-ops-iam}
app.iam.audience=${IAM_TOKEN_AUDIENCE:audit-service}

app.internal-service-secret=${INTERNAL_SERVICE_SECRET:local-dev-internal-secret}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
spring.kafka.consumer.group-id=audit-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

app.kafka.flight-events-topic=flight-events
